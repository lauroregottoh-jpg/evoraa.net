name: Daily bug hunt

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run ops:bug-hunt
        env:
          LIVE_SMOKE: "0"
